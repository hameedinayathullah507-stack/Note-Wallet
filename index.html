<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Note Wallet</title>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1> Note Wallet</h1>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">

        <!-- Notes Section -->
        <div class="container">

            <div class="empty-state">
                <h1 class="float">
                    CLICK (+) BUTTON TO ADD YOUR FIRST NOTE
                </h1>
            </div>

            <!-- Notes will be added dynamically here -->

        </div>

        <!-- Todo Widget -->
        <div class="todo-widget">

            <h3>Today's Tasks</h3>

            <div class="todo-input">

                <input
                    type="text"
                    id="input"
                    placeholder="Add a task...">

                <button id="addtodo">
                    +
                </button>

            </div>

            <div id="todo-value">

                <!-- Todo items will appear here -->

            </div>

        </div>

    </div>

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Add/Edit Note Popup -->
    <div class="form-container">

        <h2 id="popup-title">Add Note</h2>

        <input
            type="text"
            id="note-title" required
            placeholder="Note Title">

        <textarea
            id="note-content"
            placeholder="Note Content"></textarea>

        <button type="button" id="add-note">
            Add Note
        </button>

        <button type="button" id="cancel-note">
            Cancel
        </button>

    </div>

    <!-- Floating Add Button -->
    <button class="add-btn">
        +
    </button>

    <script src="script.js"></script>

</body>

</html>
